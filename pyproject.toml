[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kernelpilot"
version = "0.1.0"
description = "Feedback-driven optimization workbench for Triton GPU kernels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rimjhim Singh" }]
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
gpu = ["torch>=2.2", "triton>=2.2"]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.30"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
kernelpilot = "kernelpilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kernelpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gpu: needs a CUDA device with torch + triton installed",
    "slow: longer running integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF012", "B008"]
